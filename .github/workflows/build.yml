name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip
        run: unzip -o "$(ls *.zip | head -1)"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build
        working-directory: PhotoSorter
        run: gradle assembleDebug --no-daemon
      - name: Rename APK
        run: cp PhotoSorter/app/build/outputs/apk/debug/app-debug.apk PhotoSorter.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 사진 분류 v${{ github.run_number }}
          files: PhotoSorter.apk
          make_latest: true
