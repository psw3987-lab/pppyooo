name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PhotoSorter.apk

      - name: Upload (Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSorter-apk
          path: PhotoSorter.apk

      - name: Publish to Releases (폰에서 바로 받기)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: 사진 분류 v${{ github.run_number }}
          files: PhotoSorter.apk
          make_latest: true
